version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /paseo-plugins/attention
      - /paseo-plugins/usage-pill
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
