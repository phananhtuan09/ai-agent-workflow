<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" role="img" aria-labelledby="title desc">
  <title id="title">Repository-driven workflow network map</title>
  <desc id="desc">A metro map of the workflow. Four lines share the Request, Authority, and Work shape interchanges. Line 1 (read-only) runs to Report. Line 2 (bounded change) runs through Proof to Report. Line 3 (durable change) runs through Proof and Report, then loops through the docs/ depot back to Authority. Line 4 (decision-blocked) stops before mutation and loops back to Request.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d9d1c0"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title { fill: #1d1d1b; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .kicker { fill: #8a8273; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .st { fill: #1d1d1b; font-size: 14px; font-weight: 700; }
    .cap { fill: #6f685c; font-size: 11px; }
    .note { fill: #8a8273; font-size: 11px; font-style: italic; }
    .badge { fill: #fff; font-size: 11px; font-weight: 700; }
    .line { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .ring { fill: none; stroke: #1d1d1b; stroke-width: 2; animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.2); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0; } }
  </style>

  <rect width="1120" height="610" rx="18" fill="#f6f1e7"/>
  <rect width="1120" height="610" rx="18" fill="url(#grid)"/>
  <text x="36" y="44" class="kicker">AI AGENT WORKFLOW · NETWORK MAP</text>
  <text x="36" y="72" class="title">Every request rides one of four lines</text>
  <rect x="500" y="574" width="28" height="16" rx="8" fill="#0a76d8"/><text x="514" y="586" class="badge" text-anchor="middle">L1</text><text x="536" y="586.5" class="st" style="font-size:12px">Read-only</text>
  <rect x="620" y="574" width="28" height="16" rx="8" fill="#00a35a"/><text x="634" y="586" class="badge" text-anchor="middle">L2</text><text x="656" y="586.5" class="st" style="font-size:12px">Bounded change</text>
  <rect x="780" y="574" width="28" height="16" rx="8" fill="#8e3fbf"/><text x="794" y="586" class="badge" text-anchor="middle">L3</text><text x="816" y="586.5" class="st" style="font-size:12px">Durable change</text>
  <rect x="940" y="574" width="28" height="16" rx="8" fill="#ee7a00"/><text x="954" y="586" class="badge" text-anchor="middle">L4</text><text x="976" y="586.5" class="st" style="font-size:12px">Decision-blocked</text>
