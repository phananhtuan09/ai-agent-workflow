  <text x="930" y="491" class="note" text-anchor="middle">record accepted knowledge</text>
  <text x="282" y="380" class="note">read back as authority</text>
  <text x="430" y="432" class="note" text-anchor="middle">ask the smallest human question, then reboard</text>
  <rect class="ring" x="89" y="219" width="22" height="55" rx="11"/>
  <rect x="89" y="219" width="22" height="55" rx="11" fill="#fff" stroke="#1d1d1b" stroke-width="3.5"/>
  <text x="100" y="200" class="st" text-anchor="middle">Request</text>
  <text x="100" y="215" class="cap" text-anchor="middle">you are here</text>
  <rect x="259" y="219" width="22" height="55" rx="11" fill="#fff" stroke="#1d1d1b" stroke-width="3.5"/>
  <text x="270" y="200" class="st" text-anchor="middle">Authority</text>
  <text x="270" y="215" class="cap" text-anchor="middle">intent · evidence</text>
  <rect x="419" y="219" width="22" height="55" rx="11" fill="#fff" stroke="#1d1d1b" stroke-width="3.5"/>
  <text x="430" y="200" class="st" text-anchor="middle">Work shape</text>
  <text x="430" y="215" class="cap" text-anchor="middle">pick the smallest</text>
  <rect x="849" y="230" width="22" height="33" rx="11" fill="#fff" stroke="#1d1d1b" stroke-width="3.5"/>
  <text x="860" y="300" class="st" text-anchor="middle">Proof</text>
  <text x="860" y="315" class="cap" text-anchor="middle">cheapest reliable</text>
  <rect x="1029" y="219" width="22" height="44" rx="11" fill="#fff" stroke="#1d1d1b" stroke-width="3.5"/>
  <text x="1040" y="186" class="st" text-anchor="middle">Report</text>
  <text x="1040" y="201" class="cap" text-anchor="middle">evidence · risk</text>
  <rect x="520" y="488" width="160" height="24" rx="12" fill="#fff" stroke="#1d1d1b" stroke-width="3.5"/>
  <text x="600" y="504" class="st" text-anchor="middle" style="font-size:12px">docs/</text>
  <text x="600" y="538" class="st" text-anchor="middle">Durable memory depot</text>
  <text x="600" y="554" class="cap" text-anchor="middle">product · decisions · plans · patterns · runbooks · observed</text>
  <circle cx="660" cy="110" r="7" fill="#fff" stroke="#0a76d8" stroke-width="4"/>
  <text x="660" y="92" class="st" text-anchor="middle">Read-only</text><text x="660" y="136" class="cap" text-anchor="middle">answer with evidence · no mutation</text>
  <circle cx="660" cy="241" r="7" fill="#fff" stroke="#00a35a" stroke-width="4"/>
  <text x="660" y="223" class="st" text-anchor="middle">Bounded change</text><text x="660" y="267" class="cap" text-anchor="middle">smallest coherent change</text>
  <circle cx="665" cy="330" r="7" fill="#fff" stroke="#8e3fbf" stroke-width="4"/>
  <text x="665" y="312" class="st" text-anchor="middle">Durable change</text><text x="665" y="356" class="cap" text-anchor="middle">resumable plan in docs/plans</text>
  <circle cx="690" cy="410" r="7" fill="#fff" stroke="#ee7a00" stroke-width="4"/>
  <text x="690" y="392" class="st" text-anchor="middle">Decision-blocked</text><text x="690" y="436" class="cap" text-anchor="middle">stop before mutation</text>
  <text x="36" y="586" class="note">Map not to scale · a train departs with every request</text>
