name: pr-agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pr_agent:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'phananhtuan09' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: the-pr-agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_KEY }}
          config.model: openrouter/deepseek/deepseek-v4.1-flash-1017
          config.custom_model_max_tokens: "100000"
