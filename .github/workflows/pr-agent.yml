name: pr-agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pr_agent:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'phananhtuan09' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_KEY }}
          config.model: openrouter/deepseek/deepseek-v4.1-flash-1017
          config.custom_model_max_tokens: "100000"
          config.fallback_models: '["openrouter/qwen/qwen3.8-flash"]'
