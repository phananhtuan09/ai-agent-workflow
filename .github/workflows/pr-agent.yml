name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: the-pr-agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e # v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_KEY }}
          config.model: openrouter/poolside/laguna-s-2.1:free
          config.custom_model_max_tokens: "100000"
          config.fallback_models: '["openrouter/google/gemma-4-31b-it:free", "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
