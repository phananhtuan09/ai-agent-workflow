name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-skills
      - name: Typecheck Paseo plugins
        run: |
          for plugin in attention usage-pill; do
            (cd "paseo-plugins/$plugin" && npm ci && npm run typecheck)
          done
